name: CI

# **This file runs in `Nport-Link/ppap`, not here.** It is stored under `.github/workflows/ppap/`,
# which GitHub does not execute — only the top level of `.github/workflows/` is ever read — and
# `trigger-ci.yml` mirrors this directory into the public repository, where it becomes
# `.github/workflows/ci.yml` and runs on free GitHub-hosted minutes. `docs/CI.md` has the topology
# and ADR-0057 has the reasoning.
#
# Two consequences that shape every line below, and neither is obvious from reading it in place:
#
# 1. **The logs are world-readable.** ppap is public. A failing clippy or vitest run prints source
#    spans from a private tree into a public log. That is an accepted cost (ADR-0057), not an
#    oversight — but it is why there is no `pull_request` trigger and why `permissions:` is empty.
# 2. **The source is not here.** ppap holds workflows and nothing else, so every job checks the
#    private repository out with a PAT before it can do anything, including resolving
#    `uses: ./.github/actions/…`.

on:
  # `repository_dispatch` and nothing else. A fork cannot fire it — it needs write access to ppap —
  # so the PAT and the Actions cache stay out of reach of anyone who opens a pull request against
  # the public repository. `pull_request` here would hand both to a stranger.
  repository_dispatch:
    types: [nport-ci]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit in Nport-Link/nport to test"
        required: true
        type: string
      ref:
        description: "Branch that commit is on (labelling only)"
        required: false
        default: manual
        type: string

# ppap's own `GITHUB_TOKEN` cannot reach the private repository — it is scoped to ppap — so every
# cross-repo call below passes `secrets.PAT_TOKEN` explicitly. Saying `{}` here means nobody reaches
# for the built-in token by habit and then wonders why it 404s.
permissions: {}

concurrency:
  # Grouped by branch, not by commit: two pushes to the same branch in quick succession should
  # cancel the older run, which is what the private `ci.yml` did with `github.ref`.
  group: ci-${{ github.event.client_payload.ref || inputs.ref || 'nightly' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  # Resolved once. `env` is available in a step's `with:`, so every checkout below reads this rather
  # than repeating the fallback — and a commit is what CI judges, never a branch name, which moves.
  NPORT_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  NPORT_REPO: Nport-Link/nport

jobs:
  # ── Statuses ──────────────────────────────────────────────────────────────────────
  #
  # The verdict has to travel back to a commit in a different repository. The Checks API cannot do
  # it: `POST /check-runs` is restricted to GitHub App installation tokens and answers a PAT with
  # "Only GitHub Apps may create check runs". Commit statuses can, and they are enough — a status
  # context can be marked required in branch protection, which is the property that matters.
  #
  # `seed` runs first and with no `needs:`, so a run that is cancelled, or never starts because the
  # dispatch raced a force-push, leaves a visible pending rather than leaving the commit blank.
  # A commit with no status at all is indistinguishable from one nobody asked about.
# **Every job carries one, because nothing did and the default is six hours.** On 2026-08-19
# `install-capnp` hung and took `Codegen drift` with it for 45 minutes; it never failed, it stopped,
# and concurrency eventually killed it. The action is bounded now, but a bound inside one step only
# covers the hang somebody has already seen. These are the floor under the ones nobody has.
#
# Each is roughly twice the slowest observed run of that job — a backstop against a hang, not a
# performance target. A limit that trips on a slow-but-working job is worse than no limit, because
# the next person learns to re-run rather than to read.
  seed:
    name: Seed statuses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark every context pending
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for ctx in typescript web-e2e desktop-e2e desktop-app rust-cli deny drift summary; do
            gh api --method POST "/repos/${NPORT_REPO}/statuses/${NPORT_SHA}" \
              -f state=pending \
              -f context="ppap / ${ctx}" \
              -f target_url="${RUN_URL}" \
              -f description="queued in Nport-Link/ppap" >/dev/null
          done
          echo "Seeded 8 pending statuses on ${NPORT_SHA}."

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          # Otherwise the PAT stays in `.git/config` as an http.extraheader for the rest of the job,
          # where any postinstall script in the dependency tree can read it. Nothing here pushes.
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The Worker-shape guard, which for a long time ran only in `deploy.yml`, on a branch that a
      # `main` push never touched — so a route added to `apps/node` or `apps/registry` stayed green
      # until somebody deployed.
      # Its own failure message says why that matters: "a reachable internal Worker lets any caller
      # set their own x-nport-source-hash (ADR-0049)" — every per-source cap in `docs/ARCHITECTURE.md`
      # §7 rests on that header being unforgeable. Reads the checked-in wrangler configs and nothing
      # else, so it needs no credential and no network (defect 80).
      - run: pnpm deploy:check
      # DEC-6's inventory of shipped "MIT / open source" claims, checked against the tree in both
      # directions. That table is the thing somebody works through the day relicensing is decided, so
      # a claim missing from it outlives the decision — which had already happened once (defect 81).
      - run: pnpm licence:check
      # The release version arithmetic. `scripts/` sits outside the pnpm workspace and so outside
      # `turbo run test`, which means a `*.test.mjs` beside it would run nowhere — the selftest is
      # how that table gets exercised, and it belongs here beside the other two assertions.
      - run: node scripts/next-version.mjs --selftest

  # Its own job rather than a step in `typescript`, because it is the slowest thing in CI by an order
  # of magnitude: it runs a full OpenNext build and boots `workerd`. Failing it should not delay the
  # lint and typecheck feedback, and passing it should not be waited on by them.
  web-e2e:
    name: Web e2e
    # **`ubuntu-24.04`, pinned — not `ubuntu-latest`.** ADR-0023 makes Linux the visual baseline
    # platform because font rasterisation differs per OS, and the images in
    # `apps/web/e2e/__screenshots__/linux/` were recorded on this runner image. "Linux" is not the
    # real invariant: `--np-font` resolves to none of `-apple-system`/`SF Pro`/`Geist` there, so the
    # pixels are whatever fontconfig substitutes, which is a property of the image and not of the OS.
    # When `ubuntu-latest` rolls to the next LTS, an unpinned job re-rasterises every baseline and
    # the diff looks like a site regression. Bump this deliberately, and re-record in the same change.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only chromium, and `--with-deps` for the system libraries a headless browser needs on a bare
      # runner. Playwright pins its own browser build, which is what makes a baseline stable enough to
      # be worth having (ADR-0023) — so this must not be replaced by a system Chrome.
      - name: Install the pinned browser
        run: pnpm --filter @nport/web exec playwright install --with-deps chromium
      # `playwright.config.ts` builds through OpenNext and serves the real Worker, so there is no
      # separate build step here. That is deliberate: this tier exists to test the artifact that
      # deploys, and the first thing it caught was 33 pages that 404 only from the Worker.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # ── Recording the visual baselines ────────────────────────────────────────────────
      #
      # **On this runner, or not at all.** ADR-0023 pins baselines to Linux because font rasterisation
      # differs per OS, and the job above is where they are compared — so they have to be produced by
      # the same image and the same architecture. A baseline recorded in a Playwright container on an
      # arm64 laptop fails every run here, which is the churn the original objection to screenshot tests
      # was about.
      #
      # **The marker is read from git, not from the event.** The private `ci.yml` used
      # `contains(github.event.head_commit.message, …)`, and that field does not exist under
      # `repository_dispatch` — the step would silently never fire. Forwarding the message through
      # `client_payload` would fix the symptom and open a hole: a commit message is attacker-shaped
      # text, and interpolating it into an `if:` or a `run:` is a script-injection primitive. Reading
      # it from the checkout is both injection-proof and always the message actually under test.
      #
      # It uploads rather than commits. A workflow that pushes screenshots into the tree would be a
      # workflow that can rewrite what it is being judged against; a human downloads the artifact, looks
      # at the images, and commits them. `docs/TESTING.md` § Frontend e2e has the review rule.
      #
      # **`always()` is load-bearing.** Without it these steps only run when the job is green — which
      # is to say, only when the baselines already match and there is nothing to record. The one
      # time it worked was the first, when no baseline existed and the spec skipped. The moment a
      # baseline legitimately changed, the compare failed, this was skipped, and re-recording became
      # impossible (`docs/ROADMAP.md`, defect 51).
      - name: Is this a baseline-recording commit?
        id: marker
        if: always()
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -qF '[record-baselines]'; then
            echo "record=yes" >> "$GITHUB_OUTPUT"
          else
            echo "record=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the visual baselines
        if: always() && steps.marker.outputs.record == 'yes'
        env:
          NPORT_VISUAL: "1"
        run: pnpm --filter @nport/web exec playwright test visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always() && steps.marker.outputs.record == 'yes'
        with:
          name: visual-baselines-linux
          path: apps/web/e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: error

  # `apps/desktop`'s frontend had **zero** CI coverage before this job: `pnpm test` in the
  # `typescript` job above only runs its Vitest tier (`src/lib`, pure logic, no DOM), and the two
  # Chromium harnesses under `scripts/` — the virtualized inspector list and the filled-accent
  # accent, coffee-card and type tokens — only ever ran on whoever's laptop happened to invoke them by hand.
  # Defect 66 (a theme-inverted button ink) shipped and sat uncaught for exactly that reason: nothing
  # gated a merge on it. Neither script is the owed browser tier (that needs `tauri-driver` and is
  # still Phase 4, `docs/TESTING.md` § Frontend e2e) — both drive the WebView content in Chromium with
  # Tauri's IPC stubbed, which proves layout and computed CSS, not WKWebView/WebView2/WebKitGTK.
  desktop-e2e:
    name: Desktop e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned browser
        run: pnpm --filter @nport/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @nport/desktop check:inspector
      - run: pnpm --filter @nport/desktop check:tokens

  # **The real window, on all three engines** (ADR-0072) — the tier `desktop-e2e` above is explicitly
  # not. That one drives the WebView *content* in Chromium with the IPC stubbed; this launches the
  # built binary and drives WKWebView, WebView2 and WebKitGTK, which is where `backdrop-filter` and
  # font rendering actually diverge and where `apps/desktop/CLAUDE.md` says platform bugs come from.
  #
  # **ADR-0072 said this could not run here, and that was wrong twice over.** It said the tier "needs a
  # GUI, so it does not run on the CI runners as configured" — true of a bare Linux runner and false of
  # every runner once `xvfb-run` is in front of it, which is Tauri's own documented recipe. macOS and
  # Windows runners have a window server already. The `rust` job below has installed the WebKitGTK
  # headers on Linux since it existed, so the only new dependency here is `xvfb`.
  #
  # **`tauri build`, not `cargo build`.** Only the CLI runs `beforeBuildCommand` and embeds
  # `frontendDist`; a `cargo`-built binary opens a window whose WebView answers `asset not found:
  # index.html`, which is indistinguishable from an app that crashed on mount. That cost a retracted
  # defect entry — `docs/ROADMAP.md` 206 — and is why `build:e2e` is a script rather than a command
  # written out here.
  #
  # **Smoke only.** `wdio.conf.ts` defaults to `e2e/smoke.e2e.ts`; `e2e/staging.e2e.ts` needs a
  # deployed control plane and reads `~/.nport/config.toml`, so it is `test:e2e:staging` and not a
  # per-commit gate.
  # **Named "Desktop app", not "Desktop window".** The display name renders beside the matrix leg, so
  # the old one read `Desktop window (windows-latest)` — two different senses of "window" a character
  # apart, on the one job where a developer is already asking themselves which platform failed.
  desktop-app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/install-capnp
      # The same set the `rust` job installs to compile `src-tauri`, plus `xvfb` — which only this job
      # needs, because only this job opens a window.
      - name: Install the Linux WebView, GTK headers and a virtual display
        if: runner.os == 'Linux'
        run: |
          # **Install first, refresh only if that fails.** `apt-get update` is the half that broke in
          # run 32224853056 — it hung on `file:/etc/apt/apt-mirrors.txt Mirrorlist` and the job died
          # without ever reaching the install. The runner image ships package lists and every one of
          # these installs straight from them, so a mirror outage should not decide whether this
          # repository can build. Same ordering, same reason, as `.github/actions/install-capnp`.
          packages="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
                    librsvg2-dev libxdo-dev libssl-dev xvfb"
          # shellcheck disable=SC2086 # deliberate word splitting: $packages is a list, not one name
          sudo apt-get install -y $packages || {
            echo "the cached lists could not satisfy these — refreshing the index and retrying"
            sudo apt-get update
            sudo apt-get install -y $packages
          }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Split from the run below so a build failure and a *test* failure are different lines in the
      # log. They have completely different causes and the release build is the slow half.
      - name: Build the app with the WebDriver feature
        run: pnpm --filter @nport/desktop run build:e2e

      # `xvfb-run -a` picks a free display number rather than assuming :99 is untaken.
      - name: Drive the window
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @nport/desktop exec wdio run wdio.conf.ts
      - name: Drive the window
        if: runner.os != 'Linux'
        run: pnpm --filter @nport/desktop exec wdio run wdio.conf.ts

      # **A camera, not a gate** — UI-1. `screens` renders the app in Chromium; what that cannot show
      # is how `backdrop-filter` composites and how text renders in WKWebView, WebView2 and WebKitGTK,
      # which is the comparison UI-1 still owes and the reason it is open. These shots come out of the
      # WebView through the driver, so they need no screen-recording permission on macOS and no
      # display beyond the `xvfb` this job already has.
      #
      # `continue-on-error` because a broken camera is not a broken app, and this job's gate is the
      # smoke above. It stays visible as a red step inside a green job rather than turning the matrix
      # red for a screenshot.
      - name: Photograph every screen in the engine that ships
        continue-on-error: true
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @nport/desktop exec wdio run wdio.conf.ts --spec e2e/shots.e2e.ts
      - name: Photograph every screen in the engine that ships
        continue-on-error: true
        if: runner.os != 'Linux'
        run: pnpm --filter @nport/desktop exec wdio run wdio.conf.ts --spec e2e/shots.e2e.ts

      # **Uploaded on success, which is the point.** Every other artefact here exists to explain a
      # failure; these exist so that somebody who owns neither a Windows machine nor a Linux desktop
      # can open thirteen pictures per platform and compare them against
      # `docs/mockup/NPort Desktop.dc.html`. That comparison is what is left of UI-1.
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screens-${{ matrix.os }}
          path: apps/desktop/screens/real/
          retention-days: 14
          if-no-files-found: warn

      # The window is the thing under test and it leaves no artefact, so on a failure the log is all
      # there is. WebdriverIO writes its own under `logs/`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-app-${{ matrix.os }}
          path: |
            apps/desktop/logs/
            logs/
          retention-days: 7
          if-no-files-found: ignore

  # **"Rust CLI" is the name; the scope is the whole workspace.** `cargo clippy --all-targets` and
  # `cargo test` here cover `crates/*` **and** `apps/desktop/src-tauri`, which is a workspace member —
  # so a failure in this job is not necessarily in `crates/cli`. The name says CLI because that is the
  # artefact these three legs exist to keep portable, and because `Rust (windows-latest)` beside
  # `Desktop app (windows-latest)` reads as though only one of them is about a platform.
  rust-cli:
    name: Rust CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # All three, every time. The private `ci.yml` ran Linux-only on pull requests because macOS
        # bills at 10× and Windows at 2× — on a public repository both are free, so the reason for
        # the conditional matrix is gone and the coverage comes back. This is the single largest
        # thing the move buys (ADR-0057).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      # Resolves against `$GITHUB_WORKSPACE`, which now holds the private tree — so ppap runs the
      # composite action **at the commit under test** rather than a synced copy. That is why
      # `trigger-ci.yml` mirrors only `.github/workflows/ppap/` and deliberately not `.github/actions/`.
      # It must come after the checkout, or the path does not exist yet.
      - uses: ./.github/actions/install-capnp
      # `apps/desktop/src-tauri` is a workspace member, so a root `cargo clippy` builds it
      # on every platform. macOS and Windows have their WebView in the OS; Linux does not,
      # and the failure is a `pkg-config` error from `gobject-sys` several hundred lines
      # into an otherwise normal build. WebKitGTK is the only Linux WebView there is.
      - name: Install the Linux WebView and GTK development headers
        if: runner.os == 'Linux'
        run: |
          # Install first, refresh only on failure — see the same step in `desktop-app` and
          # `.github/actions/install-capnp`. `apt-get update` is what hung in run 32224853056.
          packages="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
                    librsvg2-dev libxdo-dev libssl-dev"
          # shellcheck disable=SC2086 # deliberate word splitting: $packages is a list, not one name
          sudo apt-get install -y $packages || {
            echo "the cached lists could not satisfy these — refreshing the index and retrying"
            sudo apt-get update
            sudo apt-get install -y $packages
          }
      # rust-toolchain.toml pins the exact version, and rustup honours it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # `--all-targets`, matching clippy above. Without it, `cargo test` skips tests that live
      # inside examples — and `crates/protocol/examples/support/proxy.rs` holds the 11 chunked
      # transfer-coding tests written for a bug that reached a browser as a page of binary
      # garbage. Verified: plain `cargo test --all-features` runs none of them.
      - run: cargo test --all-targets --all-features
      # `--all-targets` skips doctests, so they need their own run. Nothing has one yet; the step
      # exists so the first one added is not silently unrun.
      - run: cargo test --doc --all-features
      - name: Documentation consistency
        if: runner.os == 'Linux'
        run: cargo xtask verify-docs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      # A Docker action, and panda has no Docker daemon — one of the reasons this job could not
      # simply have moved to the self-hosted runner instead (`docs/CI.md` § What runs where).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # ── Generated files still match their sources ─────────────────────────────────────
  #
  # **The single mechanism keeping three languages honest**: regenerate everything, then fail if the
  # tree changed. `packages/contract` is the authority (invariant 7) and is generated outward into
  # TypeScript, Rust, two OpenAPI documents and the error registry; without this, a hand-edited
  # generated file or a forgotten `pnpm codegen` desynchronises them silently and nothing notices
  # until a client and a server disagree at runtime (ADR-0009, invariant 6).
  #
  # **A job here rather than its own workflow.** It was `codegen-drift.yml`, and it shared this file's
  # trigger, its runner and its checkout — the only thing it did not share was a concurrency group,
  # which is not worth a second entry in ppap's Actions list.
  #
  # Its `git --no-pager diff` prints into a public log on failure. That is the sharpest edge of
  # ADR-0057 and it is deliberate: the diff is the whole diagnostic value, and `--stat` would leave it
  # saying only that *something* drifted.
  drift:
    name: Codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cargo xtask codegen` builds `nport` now (it reads `Args`'s clap definition to generate
      # `schema/cli.json`), which pulls in `nport-protocol`, whose `build.rs` shells out to `capnp`.
      # Before that dependency this job needed no system toolchain at all — the commit that added it
      # claimed "the drift workflow already pays for" a Rust build, and this is that claim being wrong.
      - uses: ./.github/actions/install-capnp
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # The tree must be clean *before* codegen runs, or a leftover file reads as drift and sends
      # somebody looking for a generator bug that is not there. Free on a hosted runner, which starts
      # clean; the reason it is here at all is that the same assertion is load-bearing on panda,
      # where the workspace is reused between jobs (`docs/CI.md` § Self-hosted notes).
      - name: The tree must start clean
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::The workspace was dirty before codegen ran. This is runner hygiene, not drift."
            echo "$dirty"
            exit 1
          fi

      - run: pnpm codegen
      - run: cargo xtask codegen

      - name: Fail if generated files are out of date
        run: |
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm codegen && cargo xtask codegen' and commit the result."
            echo "$changed"
            git --no-pager diff
            exit 1
          fi
          echo "Tree is clean."


  # ── The verdict ───────────────────────────────────────────────────────────────────
  #
  # `if: always()` is what makes this correct rather than approximately correct: without it, a run
  # where anything failed would skip this job and leave five statuses stuck on pending forever,
  # which reads as "still running" rather than "failed" and is worse than no status at all.
  report:
    name: Report
    needs: [seed, typescript, web-e2e, desktop-e2e, desktop-app, rust-cli, deny, drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Post the result of every job onto the private commit
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # `needs` as JSON, so the mapping below is over whatever jobs exist rather than over a
          # hand-kept list that a new job would silently fall off.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # **Retried, because one transient 5xx here marks a green run red.** Every check can pass
          # and this job still fails: it is the only step that talks to the statuses API, and on
          # 2026-08-17 that API returned `503 No server is currently available` for several minutes
          # while reads kept working. The commit went red with nothing wrong in it, and a re-run hit
          # the same window.
          #
          # Four attempts with a widening gap covers an outage of about a minute, which is the shape
          # these take. A status that genuinely cannot be posted still fails the job — `set -e` and the
          # final attempt are unguarded — because a reporting step that swallows its own failure is
          # worse than one that is occasionally flaky: it reports nothing and says everything is fine.
          post() {
            local attempt
            for attempt in 1 2 3; do
              if gh api --method POST "/repos/${NPORT_REPO}/statuses/${NPORT_SHA}" \
                -f state="$2" -f context="ppap / $1" \
                -f target_url="${RUN_URL}" -f description="$3" >/dev/null 2>&1; then
                return 0
              fi
              echo "posting '$1' failed (attempt ${attempt}/4), retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
            done

            # The last one is not swallowed: its error text is what tells whoever reads this run
            # whether the API was down or the token lost its scope.
            gh api --method POST "/repos/${NPORT_REPO}/statuses/${NPORT_SHA}" \
              -f state="$2" -f context="ppap / $1" \
              -f target_url="${RUN_URL}" -f description="$3" >/dev/null
          }

          # `skipped` maps to success on purpose: a job skipped by a conditional has not failed, and
          # a required status that never resolves blocks a merge for no reason. `cancelled` maps to
          # `error` rather than `failure` — it is not a verdict about the code, and the distinction
          # is visible in the UI.
          jq -r 'to_entries[] | select(.key != "seed") | "\(.key)\t\(.value.result)"' <<<"$RESULTS" |
          while IFS=$'\t' read -r job result; do
            case "$result" in
              success)   post "$job" success "passed" ;;
              skipped)   post "$job" success "skipped" ;;
              cancelled) post "$job" error   "cancelled" ;;
              *)         post "$job" failure "failed — see the ppap run" ;;
            esac
          done

          # One aggregate context, and the only one worth marking required in branch protection:
          # six required contexts is six things to rename by hand the day a job is renamed.
          if jq -e 'to_entries | map(select(.key != "seed"))
                    | all(.value.result == "success" or .value.result == "skipped")' \
               <<<"$RESULTS" >/dev/null; then
            post summary success "every job passed"
          else
            post summary failure "at least one job failed — see the ppap run"
          fi
