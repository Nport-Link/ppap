name: Smoke

# **The only test that opens a port on the internet.**
#
# Everything else in CI runs against a fake: `pnpm test` drives `apps/node` in real `workerd` with
# `test/fake-cloudflare.ts`, and `pnpm smoke` drives the CLI against `wrangler dev` with a credential
# the edge refuses on purpose. Both stop at the same boundary — no tunnel has carried a byte.
#
# This one provisions a real lease on the deployed control plane, dials Cloudflare's edge over QUIC,
# and serves real requests from a local origin. It is the mechanism behind Gate G2's cross-platform
# criterion (`docs/ROADMAP.md`), which is why the matrix is the point of the file rather than a
# detail of it: the failure it exists to catch is one that only appears on an OS nobody develops on.
#
# **Runs in `Nport-Link/ppap`, and it is the reason the split was worth doing.** Measured before the
# move: the macOS leg alone billed 50 units a night at the 10× multiplier and Windows 26 more, so
# 93% of a nightly smoke's cost was the two platforms that cannot run on a Linux self-hosted box.
# On a public repository they are free. `docs/CI.md`, ADR-0057.
#
# **The per-deploy run is a job inside `deploy.yml`**, not a workflow of its own. It was a separate
# private `smoke.yml` invoked with `uses: ./…`, and that same-repo reference is exactly why it could
# not follow the rest of CI here; inlining it removed the last workflow this repository listed purely
# to satisfy a `workflow_call`. That job is Linux-only on panda; this one owns the nightly matrix.
#
# It costs one create per OS per run against the environment's per-source hourly cap. Runners have
# distinct addresses so they do not compete with each other, but a human debugging from one machine
# can still lock themselves out — `apps/node/wrangler.jsonc` § staging says why the staging cap is
# higher than production's.

on:
  # Nightly, because an edge change breaks installed clients and the point is to hear it from a cron
  # job rather than from an issue. 03:20 UTC is off the hour: every scheduled workflow on GitHub
  # fires at :00, and the queue at that minute is worth avoiding.
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: "Control plane to test against"
        required: false
        default: https://api.nport.online
        type: string
      ref:
        description: "Ref of tuanngocptn/nport-link to build the CLI from"
        required: false
        default: main
        type: string

permissions: {}

concurrency:
  # Never two matrices at once: they share the environment's tunnel cap and its per-source quota,
  # and a nightly overlapping a dispatch would fail for a reason that has nothing to do with the code.
  group: smoke-${{ inputs.backend || 'https://api.nport.online' }}
  cancel-in-progress: false

env:
  NPORT_REPO: tuanngocptn/nport-link

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # One OS failing must not cancel the others. Which platforms fail is the diagnosis — "Windows
    # only" and "everywhere" are different bugs, and fail-fast throws that away.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # A branch, not a commit: this is a nightly against whatever is currently on `main`, so unlike
      # `ci.yml` there is no commit under test to pin to. A scheduled run has no `inputs`, so the
      # fallback is what fires at 03:20.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/install-capnp

      # rust-toolchain.toml pins the exact version and rustup honours it, so nothing here names a
      # version — same as `ci.yml`. A second place naming one is a second place to forget to bump.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.os }}

      # Release, not debug. The debug binary is ~39 MB and slower to start, and the thing being
      # proved is the artifact users get.
      - name: Build the CLI
        run: cargo build --release -p nport

      - name: A real tunnel carries real traffic
        shell: bash
        env:
          BACKEND: ${{ inputs.backend || 'https://api.nport.online' }}
          RUNNER_OS_NAME: ${{ matrix.os }}
          EVENT: ${{ github.event_name }}
        run: |
          # An `if`, not `[ … ] && assign`: Actions runs bash with `-e`, so a false test as the last
          # command of a line exits 1 — and this test is false on two of the three platforms.
          if [ "$RUNNER_OS_NAME" = "windows-latest" ]; then
            binary=target/release/nport.exe
          else
            binary=target/release/nport
          fi
          # `--expiry` abandons a tunnel with SIGKILL and waits for the server's own alarm to delete
          # the DNS record — about two and a half minutes on top of the run, and one extra create.
          # Nightly only: a per-deploy matrix would pay it three times for a property that does not
          # change between commits.
          expiry=""
          if [ "$EVENT" = "schedule" ]; then
            expiry="--expiry"
          fi
          node scripts/smoke-live.mjs --backend "$BACKEND" --binary "$binary" $expiry
