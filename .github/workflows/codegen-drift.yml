name: Codegen drift

# The single mechanism keeping three languages honest: regenerate everything, then fail
# if the tree changed. Without this, `packages/contract`, `schema/`, `crates/contract`,
# the Tauri bindings, and docs/ERRORS.md drift apart silently (ADR-0009, invariant 6).
#
# **Runs in `Nport-Link/ppap`** — see the header of `ci.yml` in this directory, and `docs/CI.md`.
# It shares the `nport-ci` dispatch type with `ci.yml`, so one `repository_dispatch` from
# `ppap.yml` starts both. Two workflows rather than one job in `ci.yml` because they answer
# different questions and their concurrency groups are independent — a codegen re-run should not
# cancel an in-flight e2e.
#
# **Its `git --no-pager diff` prints into a public log.** That is the sharpest edge of ADR-0057 and
# it is deliberate: the diff is the entire diagnostic value of this job, and a `--stat` would leave
# it saying only that *something* drifted. The decision to accept public logs was taken knowing this
# is the job that exercises it hardest.

on:
  repository_dispatch:
    types: [nport-ci]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit in tuanngocptn/nport-link to test"
        required: true
        type: string
      ref:
        description: "Branch that commit is on (labelling only)"
        required: false
        default: manual
        type: string

permissions: {}

concurrency:
  group: codegen-drift-${{ github.event.client_payload.ref || inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  NPORT_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  NPORT_REPO: tuanngocptn/nport-link

jobs:
  drift:
    name: Regenerate and diff
    runs-on: ubuntu-latest
    steps:
      # Inline rather than a separate `seed` job, unlike `ci.yml`: there is one job here, so a
      # dedicated job to announce it would double the run's wall clock to say "starting".
      - name: Mark the status pending
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${NPORT_REPO}/statuses/${NPORT_SHA}" \
            -f state=pending -f context="ppap / codegen-drift" \
            -f target_url="${RUN_URL}" -f description="regenerating" >/dev/null

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NPORT_REPO }}
          ref: ${{ env.NPORT_SHA }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cargo xtask codegen` builds `nport` now (it reads `Args`'s clap definition to generate
      # `schema/cli.json`), which pulls in `nport-protocol`, whose `build.rs` shells out to `capnp`.
      # Before that dependency this job needed no system toolchain at all — the commit that added it
      # claimed "the drift workflow already pays for" a Rust build, and this is that claim being wrong.
      - uses: ./.github/actions/install-capnp
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # The tree must be clean *before* codegen runs, or a leftover file reads as drift and sends
      # somebody looking for a generator bug that is not there. Free on a hosted runner, which starts
      # clean; the reason it is here at all is that the same assertion is load-bearing on panda,
      # where the workspace is reused between jobs (`docs/CI.md` § Self-hosted notes).
      - name: The tree must start clean
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::The workspace was dirty before codegen ran. This is runner hygiene, not drift."
            echo "$dirty"
            exit 1
          fi

      - run: pnpm codegen
      - run: cargo xtask codegen

      - name: Fail if generated files are out of date
        run: |
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm codegen && cargo xtask codegen' and commit the result."
            echo "$changed"
            git --no-pager diff
            exit 1
          fi
          echo "Tree is clean."

  report:
    name: Report
    needs: [drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post the result onto the private commit
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.drift.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)   state=success; note="the tree is clean" ;;
            skipped)   state=success; note="skipped" ;;
            cancelled) state=error;   note="cancelled" ;;
            *)         state=failure; note="generated files are out of date" ;;
          esac
          gh api --method POST "/repos/${NPORT_REPO}/statuses/${NPORT_SHA}" \
            -f state="$state" -f context="ppap / codegen-drift" \
            -f target_url="${RUN_URL}" -f description="$note" >/dev/null
          echo "codegen-drift: ${RESULT} -> ${state}"
